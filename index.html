<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Log Maker</title>
    <meta name="description" content="Make League-style in-game chat overlays as transparent PNGs." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:wght@600&family=Spectral:wght@500&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="top">
      <h1>Chat Log Maker</h1>
      <div class="top-actions"></div>
    </header>

    <main class="layout">
      <section class="panel editor" aria-label="Chat lines">
        <div class="panel-head">
          <h2>Lines</h2>
          <div class="add-row">
            <button id="btn-add-chat" type="button">+ Chat</button>
            <button id="btn-add-all" type="button">+ All chat</button>
          </div>
        </div>
        <ol id="lines" class="lines"></ol>
        <details class="help">
          <summary>Color tags</summary>
          <p>Wrap words in tags to color them:</p>
          <ul>
            <li><code>&lt;gold&gt;Last Whisper&lt;/gold&gt;</code> for items and keywords</li>
            <li><code>&lt;red&gt;Draven&lt;/red&gt;</code> for enemies, <code>&lt;blue&gt;Leona&lt;/blue&gt;</code> for allies</li>
            <li><code>&lt;#ff66cc&gt;anything&lt;/&gt;</code> for any hex color</li>
          </ul>
        </details>
      </section>
      <section class="panel preview-panel" aria-label="Preview and export">
        <div class="panel-head">
          <h2>Preview</h2>
          <div class="seg" role="group" aria-label="Preview background">
            <button type="button" data-bg="checker" class="on">Transparent</button>
            <button type="button" data-bg="dark">Dark</button>
            <button type="button" data-bg="light">Light</button>
          </div>
        </div>
        <div id="stage" class="stage bg-checker">
          <canvas id="preview" aria-label="Rendered chat log"></canvas>
        </div>
        <p id="dims" class="dims"></p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
